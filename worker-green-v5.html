<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SevaSetu Worker v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#0A5A39; --g800:#0C6B44; --g700:#13824F; --g500:#3AAA48; --lime:#A5D63B; --g-soft:#E2F3DD;
  --ink:#16261E; --ink2:#4F6057; --muted:#76857D; --line:#E3ECE0;
  --cta:var(--g800); --cta-h:var(--g900);
  --red:#D3362B; --red-soft:#FCE4E1; --blue-soft:#E3ECFD; --amber-soft:#FBF0CF;
  --card:rgba(255,255,255,.92); --card-b:#FFFFFF;
  --sh:0 6px 20px rgba(16,60,38,.07),0 1px 2px rgba(16,40,25,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
  --fd:'Outfit','Noto Sans Devanagari',system-ui,sans-serif;
  --fb:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;
}
html[lang=hi]{--fd:'Noto Sans Devanagari','Outfit',sans-serif;--fb:'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);background:linear-gradient(135deg,#dfeee5,#c9dfd1);display:flex;align-items:center;justify-content:center;gap:48px;padding:20px;-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:12px}
.ic{flex-shrink:0;display:block}.fill{fill:currentColor}
h1,h2,h3,h4,.fd{font-family:var(--fd);letter-spacing:-.01em}

.panel{width:280px;max-height:calc(100vh - 40px);overflow:auto;padding:18px;border-radius:24px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px)}
.panel img{width:100%;border-radius:14px;background:#fff;display:block}
.panel p{font-size:13px;color:var(--ink2);margin:10px 0 6px}
.panel h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.dbtn{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;margin-bottom:8px;border-radius:14px;background:#fff;font-size:13px;font-weight:600;text-align:left}
.dbtn:hover{background:var(--g-soft)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font-size:12px;padding:7px 11px;border-radius:999px;background:#fff;color:var(--ink2)}
.jump button:hover{background:var(--cta);color:#fff}

.phone{position:relative;width:390px;height:min(844px,calc(100vh - 40px));border-radius:56px;background:#F2F5F2;padding:8px;box-shadow:0 40px 80px rgba(20,50,35,.25);flex-shrink:0}
/* calm, readable background: soft green wash at the top, clean neutral below */
.device{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:#f8fcf9;isolation:isolate}
.device::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(circle at 8% 13%,rgba(183,235,207,.50) 0 58px,transparent 59px),
  radial-gradient(circle at 91% 18%,rgba(205,232,255,.42) 0 65px,transparent 66px),
  radial-gradient(circle at 88% 72%,rgba(255,226,184,.32) 0 72px,transparent 73px),
  radial-gradient(circle at 13% 87%,rgba(215,245,226,.65) 0 82px,transparent 83px),
  linear-gradient(180deg,#e9f8ef 0%,#f8fcf9 48%,#e9f7ef 100%)}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 36px;font-size:15px;font-weight:600;z-index:70}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:33px;background:#0b0908;border-radius:20px}
.sb{display:flex;gap:6px;align-items:center}
#screen{position:absolute;top:50px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:28px}
#screen::-webkit-scrollbar{display:none}
.has-nav #screen{bottom:100px}
.has-track #screen{bottom:176px}
.has-dock #screen{bottom:290px}
.view{padding:8px 18px 10px;animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:5px;background:#1d2a23;z-index:80;opacity:.8}

.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--card-b);box-shadow:var(--sh)}
.card{border-radius:24px;padding:18px}
.inner{background:#F6FAF4;border:1px solid var(--line);border-radius:18px;padding:14px}
.circle{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative;transition:transform .15s}
.circle:active{transform:scale(.94)}
.circle.darkc{background:var(--cta);color:#fff;box-shadow:0 8px 16px rgba(10,90,57,.25)}
.circle .count{position:absolute;top:-2px;right:-2px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink2)}.small{font-size:13px}.tiny{font-size:11.5px}.b{font-weight:600}
.mt4{margin-top:4px}.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec h3{font-size:20px;font-weight:500}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{min-height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;width:100%;padding:0 18px;transition:transform .12s var(--ease),background .2s}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--cta);color:#fff;box-shadow:0 10px 20px rgba(10,90,57,.2)}
.btn.dark:hover{background:var(--cta-h)}
.btn.lime{background:linear-gradient(135deg,#C4EC5B,var(--lime));color:var(--g900);box-shadow:0 8px 18px rgba(120,170,30,.28)}
.btn.soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.soft:hover{background:#F6FAF4}
.btn.ghostw{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff}
.btn.danger{background:#fff;border:1.5px solid #F1B5AE;color:var(--red)}
.btn.link{min-height:44px;color:var(--ink2);font-weight:500}
.btn.sm{min-height:42px;font-size:13.5px;padding:0 16px;width:auto}
.btns{display:flex;gap:10px}
.go{width:42px;height:42px;border-radius:50%;background:var(--cta);color:#fff;display:grid;place-items:center;flex-shrink:0}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.tag.green{background:var(--g-soft);color:var(--g900)}
.tag.blue{background:var(--blue-soft);color:#2752B5}
.tag.amber{background:var(--amber-soft);color:#6F4C00}
.tag.grey{background:#EEF2EC;color:var(--ink2)}
.tag.red{background:var(--red-soft);color:#A42319}
.tag.urgent{background:var(--red);color:#fff}
.tag.urgent::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.ti{border-radius:16px;display:grid;place-items:center;flex-shrink:0;background:#fff;border:1px solid var(--line)}

.hdr{display:flex;align-items:center;gap:8px;padding:4px 0 14px}
.brandmark{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:20px;color:var(--g900)}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 0 16px}
.topbar .title{height:46px;padding:0 20px;border-radius:999px;display:flex;align-items:center;font-family:var(--fd);font-size:19px;font-weight:500}
.sp{flex:1}
.greet{font-size:28px;line-height:1.1;font-weight:500;margin:2px 0 14px}
.date{font-size:14px;color:var(--ink2)}

.availbar{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px}
.availbar .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.availbar .dot.on{background:var(--g500);box-shadow:0 0 0 4px rgba(58,170,72,.2)}
.availbar .dot.off{background:#A9B3AD}
.availbar .dot.lock{background:#E0A800}
.switch{width:54px;height:32px;border-radius:99px;background:#C9D3CD;position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.switch.on{background:var(--g700)}
.switch.on::after{transform:translateX(22px)}
.switch.sm{width:44px;height:26px}.switch.sm::after{width:20px;height:20px}.switch.sm.on::after{transform:translateX(18px)}

.hero-job{border-radius:26px;padding:14px;background:#fff;border:2px solid #9FD98A;box-shadow:0 0 0 4px rgba(58,170,72,.12),0 10px 22px rgba(16,60,38,.08);position:relative}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--g-soft);color:var(--g900);padding:6px 11px;border-radius:999px}
.live-pill i{width:8px;height:8px;border-radius:50%;background:var(--g500);animation:blink 1.1s infinite}
.hbar{height:8px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#C4EC5B,#fff)}

.wcard{border-radius:22px;padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;transition:transform .15s var(--ease)}
.wcard:hover{transform:translateY(-2px)}
.wcard h4{font-size:16px;font-weight:500;margin:4px 0 2px}
.wcard .meta{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px}

.moti{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;width:100%;text-align:left}
.mini-stat{display:flex;align-items:center;gap:6px;font-weight:700;font-family:var(--fd);font-size:17px}
.bar{height:7px;border-radius:99px;background:#E8EFE6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime),var(--g500))}
.medal{position:relative}
.medal.locked svg{filter:grayscale(.85);opacity:.5}
.medal .lock{position:absolute;right:-7px;top:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--ink2);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}

.irow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:#F6FAF4;border:1px solid var(--line)}
.irow + .irow{margin-top:8px}
.irow .ii{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0;color:var(--g800);border:1px solid var(--line)}
.irow small{display:block;font-size:11.5px;color:var(--muted)}
.irow b{font-size:15px;font-weight:600}
.irow b.big{font-family:var(--fd);font-size:20px}

.field{margin-bottom:16px}
.field label,.flabel{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:600;margin-bottom:8px}
.inp{width:100%;height:54px;border-radius:18px;border:1px solid var(--line);background:#fff;padding:0 16px;font-size:16px}
.inp:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,170,72,.25)}
.inp[disabled]{color:var(--ink2);background:#F3F6F2}
select.inp{appearance:none;-webkit-appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2376857D' stroke-width='2.4'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 14px center;padding-right:34px}
select.inp.sm{height:44px;font-size:13px;border-radius:14px;padding:0 24px 0 10px;background-position:right 8px center}
.pre-wrap{position:relative}.pre-wrap .pre{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--ink2)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--red);font-size:13px;margin-top:6px;display:none;align-items:center;gap:6px}
.err.show{display:flex}
.otp{display:flex;gap:12px;justify-content:center}
.otp input{width:62px;height:68px;border-radius:20px;border:1px solid var(--line);background:#fff;text-align:center;font-size:26px;font-family:var(--fd);font-weight:600}
.otp input:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,170,72,.25)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative;display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;text-align:left;min-height:64px}
.pick.sel{background:#F2FAEE;border-color:var(--g700)}
.pick .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--g700);color:#fff;display:none;place-items:center}
.pick.sel .tick{display:grid}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps i{flex:1;height:6px;border-radius:6px;background:#DDE7DA}
.steps i.on{background:var(--g700)}
.chip{min-height:42px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:600;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--cta);color:#fff;border-color:var(--cta)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.daychips{display:flex;gap:6px}
.daychips button{flex:1;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.daychips button.on{background:var(--cta);color:#fff;border-color:var(--cta)}
.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:#fff;border:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;min-height:42px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--cta);color:#fff}
.li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);min-height:58px;width:100%;text-align:left;font-size:15px}
.li:last-child{border-bottom:0}.li .chev{margin-left:auto;color:var(--muted)}
.faq{border-bottom:1px solid var(--line)}.faq:last-child{border-bottom:0}
.faq button{display:flex;width:100%;align-items:center;gap:10px;padding:14px 2px;text-align:left;font-weight:600;min-height:54px}
.faq p{display:none;font-size:13.5px;color:var(--ink2);line-height:1.55;padding:0 2px 14px 30px}
.faq.open p{display:block}.faq.open .chev{transform:rotate(90deg)}.faq .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.tls{display:flex;gap:12px;position:relative;padding-bottom:14px}
.tls:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.tls .c{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#fff;border:2px solid #CFE0CB;color:#fff}
.tls.done .c{background:var(--g700);border-color:var(--g700)}
.tls.cur .c{border-color:var(--g500);box-shadow:0 0 0 4px rgba(58,170,72,.2)}
.empty{text-align:center;padding:24px 16px;color:var(--ink2)}
.empty .ti{margin:0 auto 12px}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;font-size:13px}
.banner.warn{background:#FBF2D7;color:#6A4800}
.banner.info{background:#E7EEFC;color:#2752B5}
.banner.ok{background:#E4F3DF;color:var(--g900)}
.banner.off{background:#FCE4E1;color:#A42319}

/* price + hours rows */
.prow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.prow .pinp{position:relative;width:104px}
.prow .pinp span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink2)}
.prow .pinp input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);padding:0 10px 0 26px;font-size:16px;font-weight:700}
.prow .pinp input:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,170,72,.25)}
.prow .hint{width:100%;margin:0}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.hrow b{width:46px;font-size:13px}
.hrow.offd select{opacity:.4;pointer-events:none}
.ft{display:flex;align-items:center;gap:8px}
.ft small{font-size:12px;color:var(--muted);font-weight:600}

/* colored work cards on Home */
.cnt{min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;margin-right:auto;margin-left:8px}
.vall{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:700;color:var(--g800);padding:6px 4px 6px 10px;border-radius:999px}
.vall:hover{background:var(--g-soft)}
.tag.todayt{background:var(--red);color:#fff}
.tag.todayt::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.tcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:20px;padding:14px;margin-bottom:10px;background:#fff;border:1px solid rgba(16,60,38,.06);box-shadow:0 6px 18px rgba(16,60,38,.07);cursor:pointer;touch-action:manipulation;transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,60,38,.1)}
.tcard:active{transform:scale(.98)}
.tc-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tc-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--g-soft);color:var(--g800);white-space:nowrap}
.tc-pill.done{background:#EEF1EF;color:#5E6B64}.tc-pill.red{background:#FDE8E6;color:var(--red)}.tc-pill.new{background:#FFF1D6;color:#9A5B00}
.tc-name{font-family:var(--fd);font-weight:600;font-size:17px;color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-loc{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);max-width:100%;min-width:0}
.tc-loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-chev{flex-shrink:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#F2F5F3;color:var(--ink)}
.tcard.is-done{background:rgba(255,255,255,.75)}.tcard.is-done>div:first-child{opacity:.7}.tcard.is-done .tc-name{color:#4A5650}
.tcard.is-off .tc-name{text-decoration:line-through;color:var(--muted)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;position:relative;z-index:1}
.tc-ic{width:50px;height:50px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.12);flex-shrink:0}
.tc-title{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--c);margin:8px 0 8px;position:relative;z-index:1}
.tc-foot{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.tc-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.85);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tc-chip .ic{color:var(--c)}
.tc-go{margin-left:auto;width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ink);flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tc-acc{margin-left:auto;width:42px;height:42px;border-radius:12px;background:var(--cta);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 12px rgba(10,90,57,.25)}
.tc-btns{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.tc-btns .btn{min-height:46px;font-size:14.5px}

/* work details sheet (colored header instead of a photo) */
.sheet.jd{padding:0;background:#F3F7F3}
.jd-head{position:relative;height:150px;z-index:2}
.jd-bg{position:absolute;inset:0;overflow:hidden}
.jd-deco{position:absolute;right:-18px;bottom:-34px;opacity:.16;transform:rotate(-12deg)}
.jd-grab{position:absolute;top:10px;left:50%;transform:translateX(-50%);margin:0;background:rgba(0,0,0,.18)}
.jd-dist{position:absolute;right:14px;top:22px;display:flex;align-items:center;gap:4px;background:#fff;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.jd-dist .ic{color:var(--red)}
.jd-ic{position:absolute;left:22px;bottom:-32px;width:66px;height:66px;border-radius:50%;color:#fff;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.jd-card{margin:8px 10px 10px;padding:38px 16px 14px;background:#fff;border-radius:24px;border:1px solid var(--line)}
.jd-lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.jd-title{font-size:22px;font-weight:600;margin-top:2px}
.jd-sub{font-size:13px;font-weight:700;margin-top:2px}
.jd-x{width:38px;height:38px;border-radius:50%;background:#F1F4F1;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.jd-desc{font-size:14px;color:var(--ink2);line-height:1.55;margin-top:10px}
.jd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.jd-f{background:#F3F6F2;border-radius:16px;padding:10px 12px;min-width:0}
.jd-f small{display:block;font-size:11.5px;color:var(--muted)}
.jd-f b{display:block;font-size:14px;margin-top:2px;line-height:1.3}
.btn.jd-main{border-radius:18px;background:#14883F;color:#fff;box-shadow:0 8px 18px rgba(20,136,63,.25);font-size:16px}
.btn.jd-soft{border-radius:16px;background:#E5F4E7;color:var(--g800)}

/* hours in a day (for per-day price) */
.dayhrs{width:100%;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-radius:14px;background:#F6FAF4;border:1px solid var(--line);color:var(--g700)}
.dayhrs b{color:var(--ink)}
.step{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex-shrink:0}
.step button{width:32px;height:32px;border-radius:50%;background:var(--g-soft);color:var(--g900);display:grid;place-items:center}
.step b{min-width:52px;text-align:center;font-size:13px}

/* badge strip on Home */
.moti2{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:24px;color:#fff;background:radial-gradient(120% 140% at 0% 0%,rgba(255,213,74,.38),transparent 48%),linear-gradient(135deg,#13824F,#0A5A39 60%,#174F3A);box-shadow:0 14px 28px rgba(10,90,57,.28)}
.moti2::after{content:"";position:absolute;top:0;bottom:0;left:-90px;width:70px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{left:-90px}55%,100%{left:120%}}
.m2-med{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,.06) 70%);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px rgba(255,213,74,.6)}}
.m2-t{font-family:var(--fd);font-size:17px;font-weight:600}
.m2-pill{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);padding:4px 9px;border-radius:999px;font-weight:700;font-size:13px;font-family:var(--fd);flex-shrink:0}
.m2-bar{height:9px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.m2-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FFD54A,#C4EC5B)}

/* slim pill work cards: icon, time, distance + color in the first half */
.mcard{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:72px;padding:6px 8px 6px 6px;margin-bottom:10px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px rgba(16,60,38,.07);text-align:left;cursor:pointer;transition:transform .15s var(--ease)}
.mcard:hover{transform:translateY(-2px)}
.mc-left{display:flex;align-items:center;gap:8px;height:100%;width:47%;flex-shrink:0;padding:0 10px 0 5px;border-radius:999px;color:#fff;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff))}
.mc-ic{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.mc-left b{display:block;font-family:var(--fd);font-size:15px;font-weight:600;line-height:1.15;white-space:nowrap}
.mc-left small{display:flex;align-items:center;gap:3px;font-size:11.5px;opacity:.92;white-space:nowrap}
.mc-left>span:last-child{min-width:0;overflow:hidden}.mc-left small{overflow:hidden;text-overflow:ellipsis;font-size:11px}
.mc-right{display:flex;flex-direction:column;gap:2px;min-width:0}
.mc-title{font-family:var(--fd);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.mc-right small{font-size:12px;color:var(--ink2)}
.mc-exp{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:#6F4C00!important;background:var(--amber-soft);padding:2px 7px;border-radius:999px}
.mc-go,.mc-acc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#F1F4F1;color:var(--ink)}
.mc-acc{width:44px;height:44px;background:var(--cta);color:#fff;box-shadow:0 6px 12px rgba(10,90,57,.25)}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite;flex-shrink:0}
.popexp{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:7px 14px;border-radius:999px;font-size:14px}
.nowrap{white-space:nowrap}

/* details header comes alive: moving colors, wiggling icon, pulsing badge */
.jd-bg{background-size:220% 220%!important;animation:jdshift 5s ease-in-out infinite}
@keyframes jdshift{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.jd-deco{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-12deg)}25%{transform:rotate(-5deg) translateY(-6px)}75%{transform:rotate(-18deg) translateY(3px)}}
.jd-ic{animation:ping 1.8s ease-out infinite,buzz 3s ease-in-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.95),0 8px 18px rgba(0,0,0,.18)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0),0 8px 18px rgba(0,0,0,.18)}}
@keyframes buzz{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-9deg)}88%{transform:rotate(9deg)}91%{transform:rotate(-6deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-2deg)}}
.jd-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.7) 0 3px,transparent 4px),radial-gradient(circle at 60% 20%,rgba(255,255,255,.6) 0 2px,transparent 3px),radial-gradient(circle at 40% 70%,rgba(255,255,255,.5) 0 4px,transparent 5px),radial-gradient(circle at 80% 60%,rgba(255,255,255,.6) 0 2px,transparent 3px);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* profile + update profile */
.pfav{position:relative;flex-shrink:0;line-height:0}
.pfmed{position:absolute;right:-4px;bottom:0;background:#fff;border-radius:50%;padding:2px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.skrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;border:1px solid var(--line);background:#fff;margin-top:10px}
.skrow .ti{border-radius:18px}
.pchip{font-size:12px;font-weight:700;background:#F1F4F1;padding:4px 9px;border-radius:999px;color:var(--ink2)}
.pen{width:40px;height:40px;border-radius:50%;background:var(--g-soft);color:var(--g800);display:grid;place-items:center;flex-shrink:0}
.edav{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.chg{color:var(--g800);font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.addbtn{border-radius:20px;margin-top:12px}
.pinp2{position:relative}
.pinp2 span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--g700)}
.pinp2 input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);padding:0 12px 0 30px;font-size:17px;font-weight:700}
.pinp2 input:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,170,72,.25)}
.sheet.nb{animation:none}

/* footer */
.nav{position:absolute;left:14px;right:14px;bottom:22px;height:70px;display:none;z-index:20;border-radius:999px;align-items:center;justify-content:space-between;padding:0 8px}
.has-nav .nav{display:flex}
.nav button{flex:1;height:56px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);transition:background .25s,color .25s}
.nav button.on{background:var(--cta);color:#fff;flex:1.25}

/* Swiggy-style request carousel above footer */
.dock{position:absolute;left:0;right:0;bottom:98px;display:none;z-index:21;animation:dockin .45s var(--ease)}
.has-dock .dock,.has-track .dock{display:block}
@keyframes dockin{from{transform:translateY(30px);opacity:0}}
.dhead{display:flex;align-items:center;gap:8px;padding:0 22px 6px;font-size:12px;font-weight:700;color:var(--g900)}
.live{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:5px;background:#BFD3BB;transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--g700)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 14px 4px;scroll-padding:0 14px}
.car::-webkit-scrollbar{display:none}
.rc{flex:0 0 calc(100% - 26px);scroll-snap-align:start;border-radius:24px;padding:12px;cursor:pointer}
.car.one .rc{flex-basis:100%}
.rc.urg{background:linear-gradient(140deg,#13824F,#0A5A39);color:#fff;box-shadow:0 14px 28px rgba(10,90,57,.35)}
.rc.sch{background:#fff;border:1.5px solid #CDE6C4;box-shadow:0 14px 28px rgba(16,60,38,.14)}
.rc .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);position:relative;flex-shrink:0}
.rc .ring::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(196,236,91,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.rc .btn{min-height:44px;font-size:14px}
.trk{margin:0 12px;border-radius:24px;padding:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer}
.tbar{height:5px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.tbar i{display:block;height:100%;background:#C4EC5B;transition:width 1s linear}
.tbar.dk{background:#E3EDE1}.tbar.dk i{background:linear-gradient(90deg,var(--lime),var(--g500))}

#overlay{position:absolute;inset:0;z-index:60;display:none}
#overlay.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(15,40,28,.32);backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:10px;right:10px;bottom:12px;border-radius:32px;padding:20px 18px 16px;animation:up .4s var(--ease);max-height:calc(100% - 64px);overflow:auto;background:#fff;box-shadow:0 20px 50px rgba(10,60,35,.25)}
.sheet .grab{margin-top:-6px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.spark{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#DDF2C8 55%,#A5D63B);border:1px solid #fff;color:var(--g900);flex-shrink:0}
.bigic{width:76px;height:76px;margin:4px auto 14px}

.fullreq{position:absolute;inset:0;z-index:65;color:#fff;display:flex;flex-direction:column;padding:70px 22px 34px;background:radial-gradient(90% 60% at 50% 30%,rgba(165,214,59,.45),transparent 70%),linear-gradient(170deg,#13824F 0%,#0A5A39 60%,#063E27 100%);animation:fade .25s}
.fullreq.closing{animation:shrink .5s var(--ease) forwards}
@keyframes shrink{to{transform:translateY(62%) scale(.9);opacity:0;border-radius:40px}}
.pulse{position:relative;width:150px;height:150px;margin:14px auto 18px}
.pulse span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(196,236,91,.8);animation:ring 1.8s infinite}
.pulse span:nth-child(2){animation-delay:.6s}.pulse span:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.1);opacity:0}}
.catimg{display:block;flex-shrink:0;object-fit:contain}
.cattile{display:grid;place-items:center;flex-shrink:0;border:1px solid #fff}
.pulse .core{position:absolute;inset:38px;border-radius:50%;background:#fff;color:var(--g800);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.autobar{height:4px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:auto}
.autobar i{display:block;height:100%;width:100%;background:#C4EC5B;animation:drain 3s linear forwards}
@keyframes drain{to{width:0}}

#toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-20px);background:var(--g900);color:#fff;font-size:13.5px;padding:12px 18px;border-radius:999px;opacity:0;transition:all .3s var(--ease);z-index:90;pointer-events:none;display:flex;gap:8px;align-items:center;width:max-content;max-width:340px}
#toast.show{opacity:1;transform:translate(-50%,0)}

.splash{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:69}
.splash img{width:84%;max-width:320px;display:block;margin:0 auto;animation:logoIn .9s var(--ease)}
@keyframes logoIn{from{opacity:0;transform:scale(.92)}}
.splash .load{width:120px;height:4px;border-radius:9px;background:#E6F1E3;overflow:hidden;margin-top:30px}
.splash .load i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--g700));animation:fillx 2s linear forwards;width:0}
@keyframes fillx{to{width:100%}}
/* new brand: logo, splash, login, OTP */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px}
.brand svg{width:96px;height:auto;display:block}
.brand b{font-family:'Outfit',sans-serif;font-weight:700;font-size:44px;line-height:1;letter-spacing:-.015em;color:#24503C}

#authArt{display:none}.auth #authArt{display:block}
.auth::before,.splash{background:
  radial-gradient(circle at 8% 13%,rgba(183,235,207,.50) 0 58px,transparent 59px),
  radial-gradient(circle at 91% 18%,rgba(205,232,255,.42) 0 65px,transparent 66px),
  linear-gradient(180deg,#e9f8ef 0%,#f8fcf9 48%,#e9f7ef 100%)}
.splash{cursor:pointer}
.splash-lang{position:absolute;top:60px;left:18px}.splash-lang .lang-pill{height:36px;font-size:12.5px;padding:0 12px}
.skip{position:absolute;top:60px;right:18px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.85);font-size:13px;font-weight:700;color:var(--g900);box-shadow:var(--sh)}
/* the story: the first thing people read */
.story{font-family:var(--fd);font-weight:600;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
.story span{display:block}
.story em{font-style:normal;padding:0 .08em;border-radius:.2em}
.story em.o{color:#A84F00;background:linear-gradient(transparent 62%,rgba(246,165,43,.35) 62%)}
.story em.g{color:var(--g800);background:linear-gradient(transparent 62%,rgba(165,214,59,.40) 62%)}
.story .s3{color:var(--g900);font-weight:700}
.splash .stage{position:absolute;left:0;right:0;top:50px;bottom:250px;display:grid;place-items:center;padding:0 28px}
.splash .stage>*{grid-area:1/1}
.splash .story{display:contents}
.splash .story span{grid-area:1/1;font-size:31px;line-height:1.2;text-align:center;opacity:0;animation:seq 2s var(--ease) both}
.splash .story .s1{animation-delay:.2s}.splash .story .s2{animation-delay:2.2s}.splash .story .s3{animation-delay:4.2s}
@keyframes seq{0%{opacity:0;transform:translateY(-46px)}22%{opacity:1;transform:none}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(24px)}}
.splash .brand{animation:fadeIn .3s ease 6.2s both}
.splash .brand svg{width:104px;overflow:visible}
.splash .brand b{font-size:44px;animation:riseIn .5s var(--ease) 6.8s both}
/* logo: the two people slide in and meet = "brings them together" */
.splash .lm-g{animation:fromL .7s cubic-bezier(.34,1.4,.64,1) 6.2s both}
.splash .lm-o{animation:fromR .7s cubic-bezier(.34,1.4,.64,1) 6.2s both}
.splash .lm-w{animation:fadeIn .4s ease 6.7s both}
@keyframes fromL{from{opacity:0;transform:translateX(-34px)}}
@keyframes fromR{from{opacity:0;transform:translateX(34px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.splash .story span{display:none}.splash .brand,.splash .brand *{animation:none!important}}
.hello{text-align:center;margin-top:26px}.hello h2{font-size:22px;font-weight:600;color:var(--ink)}.hello p{font-size:14px;color:var(--ink2);line-height:1.55;margin:6px auto 0}
/* on-screen number keypad */
#kp{position:absolute;left:0;right:0;bottom:0;z-index:60;background:#D6DED8;padding:8px 6px 30px;border-radius:0 0 48px 48px;transform:translateY(105%);transition:transform .28s var(--ease);box-shadow:0 -6px 20px rgba(16,60,38,.10)}
#kp.show{transform:none}
.kp-top{display:flex;justify-content:space-between;align-items:center;padding:0 10px 8px;font-size:12.5px;color:var(--ink2)}
.kp-top button{font-weight:700;color:var(--g800);font-size:14px;padding:4px 6px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-grid button{height:50px;border-radius:10px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-size:24px;font-weight:500;line-height:1;color:var(--ink)}
.kp-grid button small{font-family:var(--fb);font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-top:2px;min-height:10px}
.kp-grid button:active{background:#C3CCC6}
.kp-grid .kp-fn{background:transparent;box-shadow:none}
.kp-grid .kp-fn:active{background:#C3CCC6}
.kp-open #authArt{opacity:0}
/* working hours (registration) */
.hrsbox{border-radius:20px;background:#fff;border:1px solid var(--line);padding:14px}
.hrsbox .ii{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g-soft);color:var(--g800);flex-shrink:0}
.hrsbox b{font-size:15px}
.hrsn{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--g-soft);color:var(--g900);font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.hrsn.bad{background:var(--red-soft);color:var(--red)}
/* slide to cancel */
.slidecx{margin-top:12px}
.sc-track{position:relative;height:56px;border-radius:999px;background:#FDECEA;border:1px solid #F4C6C0;overflow:hidden;user-select:none;-webkit-user-select:none}
.sc-fill{position:absolute;left:0;top:0;bottom:0;width:56px;border-radius:999px;background:#F9D3CE}
.sc-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding-left:44px;font-weight:700;color:var(--red);font-size:14.5px;pointer-events:none}
.sc-txt i{font-style:normal;opacity:.55;letter-spacing:-2px}
.sc-knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(211,54,43,.35);touch-action:none;cursor:grab;z-index:1}
.sc-knob::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(211,54,43,.45);animation:scpulse 1.6s ease-out infinite}
@keyframes scpulse{from{transform:scale(1);opacity:1}to{transform:scale(1.35);opacity:0}}
.sc-txt i{display:inline-block;animation:scnudge 1.2s ease-in-out infinite}
@keyframes scnudge{50%{transform:translateX(6px);opacity:1}}
.sc-track.dis{opacity:.5}.sc-track.dis .sc-knob{background:#C9A9A5;box-shadow:none}.sc-track.dis .sc-knob::after{display:none}
.sc-knob.back{transition:transform .3s var(--ease)}.sc-fill.back{transition:width .3s var(--ease)}
/* work details: customer name line, description box with voice note */
.rq-cust{display:flex;align-items:center;gap:10px;margin:14px 2px 0}
.rq-cust small{display:block;font-size:11.5px;color:var(--muted)}.rq-cust b{font-size:15.5px;font-weight:600}
.rq-descbox{margin-top:12px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:12px 14px}
.rq-dl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rq-descbox p{font-size:14.5px;line-height:1.55;color:var(--ink);margin-top:6px}
.vnote{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--g-soft);color:var(--g900)}
.vnote .vp{width:36px;height:36px;border-radius:50%;background:var(--g800);color:#fff;display:grid;place-items:center;flex-shrink:0}
.vnote .vw{flex:1;display:flex;align-items:center;gap:3px;height:24px}
.vnote .vw i{flex:1;max-width:4px;border-radius:3px;background:#8CC79A;height:var(--h)}
.vnote.on .vw i{animation:vbar .7s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes vbar{to{height:4px}}
.vnote small{font-size:12px;font-weight:700;min-width:30px;text-align:right}
.vlbl{font-size:11.5px;color:var(--muted);margin:8px 0 0 4px}
.rq-acts{grid-template-columns:repeat(2,1fr)!important}
/* calendar: two-week strip, Today / Tomorrow heading, distance on card */
.calday{font-family:var(--fd);font-size:24px;font-weight:600;line-height:1.1}
.calhead .mbtn.sub{font-size:13.5px!important;font-weight:600;color:var(--ink2);padding:2px 0;font-family:var(--fb)}
.week.strip{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;justify-content:flex-start;padding:6px 2px 4px;margin:-6px -2px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.week.strip::-webkit-scrollbar{display:none}
.week.strip .dayp{flex:0 0 44px;scroll-snap-align:center}
.lvstep{display:flex;align-items:center;gap:10px;padding:6px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.lvstep .circle{width:44px;height:44px;background:var(--g-soft);color:var(--g900)}.lvstep .circle:disabled{opacity:.35;cursor:default}
.lvd{flex:1;text-align:center;line-height:1.2}.lvd b{display:block;font-family:var(--fd);font-size:17px;font-weight:600}.lvd small{font-size:12px;color:var(--muted)}
.todaybtn{height:36px;padding:0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--g800)}
.tcard{position:relative}
.tc-dist{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--g800);background:var(--g-soft);padding:3px 8px;border-radius:999px}
/* coach marks: guided tour over the real screens */
#coach{position:absolute;inset:0;z-index:94}
.co-hole{position:absolute;border-radius:18px;box-shadow:0 0 0 2000px rgba(8,30,20,.66),0 0 0 3px #C4EC5B;transition:all .35s var(--ease);pointer-events:none}
.co-tip{position:absolute;left:16px;right:16px;background:#fff;border-radius:22px;padding:14px 16px 14px;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:top .35s var(--ease);animation:fade .3s}
.co-tip .co-n{font-size:12px;font-weight:700;color:var(--muted)}
.co-tip h3{font-size:18px;font-weight:600;margin-top:4px}
.co-tip p{font-size:14px;color:var(--ink2);line-height:1.5;margin-top:4px}
.co-btns{display:flex;align-items:center;gap:10px;margin-top:12px}
.co-btns .skip2{font-size:13.5px;font-weight:700;color:var(--muted);padding:8px 4px}
.co-btns .btn{min-height:44px;width:auto;flex:0 0 auto;padding:0 20px;margin-left:auto}
/* letter keyboard (registration text fields) */
.kb-row{display:flex;gap:5px;justify-content:center;margin-bottom:7px}
.kb-row button{flex:1;max-width:34px;height:44px;border-radius:8px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.18);font-size:19px;color:var(--ink);display:grid;place-items:center}
.kb-row button:active{background:#C3CCC6}
.kb-row .kb-fn{max-width:none;flex:1.5;background:#B9C4BD;font-size:14px;font-weight:700}
.kb-row .kb-fn.on{background:#fff}
.kb-row .kb-space{max-width:none;flex:5;font-size:13px;color:var(--muted)}
.kb-row .kb-go{max-width:none;flex:2;background:var(--g800);color:#fff;font-size:14px;font-weight:700;box-shadow:none}
.kb-row .kb-go:active{background:var(--g900)}
.hb svg{width:38px;height:auto}.hb b{font-family:'Outfit',sans-serif;font-weight:700;font-size:21px;color:#24503C;letter-spacing:-.01em}
.inp.ta{height:auto;min-height:92px;padding:12px 16px;resize:none;line-height:1.5;font-size:15px;display:block}
.opt{font-weight:500;color:var(--muted);font-size:12.5px}
/* points page after registration */
.ptshero{text-align:center;padding-top:34px}
.ptscoin{width:112px;height:112px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#FFF6C9,#FFD54A 55%,#E9A400);color:#7A4B00;box-shadow:0 14px 30px rgba(233,164,0,.35),inset 0 0 0 6px rgba(255,255,255,.45);animation:okpop .6s cubic-bezier(.2,1.6,.4,1) both}
.ptscoin>div{display:flex;flex-direction:column;align-items:center;gap:3px}
.ptscoin b{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1}
.ptscoin span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.why{margin-top:18px;padding:6px 16px;text-align:left}
.why .wr{display:flex;gap:12px;padding:12px 0;align-items:flex-start}
.why .wr+.wr{border-top:1px solid var(--line)}
.why .wi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.why b{display:block;font-size:15px}.why p{font-size:13.5px;color:var(--ink2);line-height:1.45;margin-top:2px}
.earn{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.earn span{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
/* "how it works" tour */
.tourbox{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:#fff;border-radius:30px;padding:18px 20px 18px;box-shadow:0 24px 60px rgba(10,60,35,.3);animation:fade .3s}
.tourtop{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted)}
.tourtop button{font-size:13.5px;font-weight:700;color:var(--g800);padding:8px 4px}
.tourstep{text-align:center;padding:10px 4px 0;animation:enter .35s var(--ease)}
.tourart{width:96px;height:96px;margin:6px auto 16px;border-radius:30px;display:grid;place-items:center;color:#fff;box-shadow:0 14px 28px rgba(10,60,35,.18)}
.tourstep h3{font-size:22px;font-weight:600;line-height:1.2}
.tourstep p{font-size:15px;color:var(--ink2);line-height:1.55;margin-top:8px;min-height:94px}
.tourdots{display:flex;gap:6px;justify-content:center;margin:14px 0 16px}
.tourdots i{width:7px;height:7px;border-radius:9px;background:#D5E3D5;transition:width .25s,background .25s}
.tourdots i.on{width:22px;background:var(--g700)}
.tourbtns{display:flex;gap:10px}.tourbtns .btn{min-height:50px}
.kp-grid .kp-go{background:var(--g800);color:#fff;box-shadow:none}.kp-grid .kp-go:active{background:var(--g900)}
.view{transition:transform .28s var(--ease)}
.auth2 .lang-pill{position:absolute;top:-4px;right:0;height:38px;font-size:12.5px;padding:0 12px}
.auth2 .circle.glass{position:absolute;top:-4px;left:0;background:#fff;width:44px;height:44px}
.phonebox{display:flex;align-items:center;height:56px;border-radius:16px;background:#fff;border:1.5px solid #CFE3D3;padding:0 16px;transition:border-color .2s,box-shadow .2s}
.phonebox:focus-within{border-color:#7CC48A;box-shadow:0 0 0 4px rgba(124,196,138,.22)}
.phonebox span{font-weight:700;font-size:17px;color:var(--ink);padding-right:14px;margin-right:14px;border-right:1.5px solid var(--line);line-height:26px}
.phonebox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;letter-spacing:.02em;height:100%}
.auth2 .btn.dark{min-height:54px;font-size:15.5px;font-weight:700;box-shadow:0 12px 22px rgba(10,90,57,.22)}
.auth2 .otp6 input{width:42px;height:50px;border-radius:14px;border-color:#E1EAE3;font-size:21px}
.rs-line{text-align:center;font-size:13px;color:var(--ink2);margin-top:16px;line-height:1.6}
.rs-line button{display:block;margin:0 auto;font-size:13px;font-weight:700;color:var(--g800)}
.rs-line button:disabled{cursor:default;opacity:1}
.panel-logo{background:#fff;border-radius:14px;padding:14px 0 12px}.panel-logo svg{width:58px}.panel-logo b{font-size:28px}
.logo-card{background:#fff;border-radius:24px;padding:8px 14px;display:flex;justify-content:center}
.logo-card img{width:100%;max-width:260px;display:block}

/* map picker */
.mapbox{position:relative;border-radius:22px;overflow:hidden;height:220px;border:1px solid var(--line);cursor:crosshair}
.mapbox .mpin{position:absolute;transform:translate(-50%,-100%);color:var(--red);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));transition:left .25s var(--ease),top .25s var(--ease);pointer-events:none}
.mapbox .me{position:absolute;width:16px;height:16px;border-radius:50%;background:#2F6BDB;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,107,219,.2);transform:translate(-50%,-50%)}

/* calendar */
.calsticky{position:sticky;top:-8px;z-index:6;margin:-8px -18px 0;padding:8px 18px 10px;background:linear-gradient(180deg,#e9f8ef 0%,#f1faf4 70%,rgba(248,252,249,.96) 100%);backdrop-filter:blur(10px)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mbtn{display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:var(--fd);font-size:21px;font-weight:500;padding:4px 6px;border-radius:12px}
.mbtn:hover{background:#fff}
.week{display:flex;gap:6px;justify-content:space-between}
.dayp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:11.5px;color:var(--ink2);position:relative;min-height:76px;transition:transform .2s}
.dayp b{font-size:15px;color:var(--ink);font-family:var(--fd)}
.dayp.today{border:2px solid var(--lime)}
.dayp.past b{color:var(--muted)}
.dayp.sel{background:var(--cta);color:#D9F0D2;border-color:var(--cta);transform:translateY(-4px);box-shadow:0 10px 20px rgba(10,90,57,.25)}
.dayp.sel b{color:#fff}
.dayp .dt{position:absolute;bottom:7px;width:5px;height:5px;border-radius:50%;background:var(--g500)}
.dayp.sel .dt{background:var(--lime)}
.dayp.off{background:repeating-linear-gradient(135deg,#fff 0 6px,#ECF0EB 6px 12px)}
.dayp.off b{text-decoration:line-through;color:var(--muted)}
.dayp.off.sel{background:#5C6B63}.dayp.off.sel b{color:#fff}
.dayp .offt{position:absolute;bottom:4px;font-size:9px;font-weight:700;color:var(--red)}
.dayp.sel .offt{color:#FFD2CC}
.dayp .part{position:absolute;bottom:7px;width:14px;height:4px;border-radius:3px;background:repeating-linear-gradient(90deg,#9AA8A0 0 3px,transparent 3px 5px)}
.timeline{position:relative;margin-top:14px}
.hr-row{display:flex;align-items:flex-start;height:60px}
.hr-row span{width:58px;font-size:11px;color:var(--muted);transform:translateY(-7px);flex-shrink:0}
.hr-row i{flex:1;border-top:1px dashed #DCE5D9}
.evt{position:absolute;left:62px;right:2px;border-radius:16px;padding:9px 12px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 14px rgba(20,60,40,.07);text-align:left;transition:transform .15s}
.evt:hover{transform:translateX(2px)}
.evt b{font-family:var(--fd);font-weight:500;font-size:15px;display:block}
.evt small{font-size:11.5px;color:var(--ink2);display:block}
.evt .tm{font-size:12px;font-weight:700;margin-top:3px}
.evt.done{background:#fff !important;border:1px solid var(--line);opacity:.92}
.evt.block{background:repeating-linear-gradient(135deg,#F1F4F0 0 8px,#E4EAE2 8px 16px);border:1px dashed #A9B6AE;color:var(--ink2);box-shadow:none}
.now-mark{position:absolute;left:58px;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.now-mark::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.dayoff-ov{position:absolute;inset:0 0 0 58px;border-radius:18px;background:repeating-linear-gradient(135deg,rgba(241,244,240,.95) 0 10px,rgba(228,234,226,.95) 10px 20px);display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2);font-weight:600;cursor:pointer;border:1px dashed #A9B6AE}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{height:48px;border-radius:14px;background:#F6FAF4;border:1px solid var(--line);font-weight:600;font-size:14px}
.mgrid button.on{background:var(--cta);color:#fff;border-color:var(--cta)}
.mgrid button.now{border:2px solid var(--lime)}
.yrow{display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:18px;background:#F6FAF4;border:1px solid var(--line)}
.yrow b{font-family:var(--fd);font-size:22px}

/* leaderboard */
.lbhero{position:relative;margin-top:4px;border-radius:30px;padding:10px 10px 0;color:#fff;overflow:hidden;background:radial-gradient(110% 70% at 50% 0%,rgba(196,236,91,.42),transparent 62%),linear-gradient(165deg,#13824F,#0A5A39 70%,#063E27);box-shadow:0 18px 34px rgba(10,90,57,.3)}
.lbhero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 34%,rgba(255,255,255,.22) 0 2px,transparent 3px),radial-gradient(circle at 86% 26%,rgba(255,255,255,.25) 0 2px,transparent 3px),radial-gradient(circle at 72% 50%,rgba(255,255,255,.16) 0 3px,transparent 4px),radial-gradient(circle at 24% 58%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 50% 18%,rgba(255,213,74,.35) 0 3px,transparent 4px)}
.lbhero .tabs{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);position:relative}
.lbhero .tabs button{color:rgba(255,255,255,.85)}
.lbhero .tabs button.on{background:#fff;color:var(--g900)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:4px;position:relative}
.pod{display:flex;flex-direction:column;align-items:center;flex:1;max-width:112px;min-width:0;text-align:center}
.pod .crown{color:#FFD54A;height:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.pav{border-radius:50%;overflow:hidden;line-height:0;margin-top:4px}
.pav .avc{border:0;box-shadow:none}
.pod .pn{font-size:14px;margin-top:9px;max-width:100%;display:block}
.pod .pp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:999px;margin-top:4px}
.pblock{width:100%;margin-top:10px;border-radius:18px 18px 0 0;display:flex;justify-content:center;padding-top:6px}
.pblock span{font-family:var(--fd);font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.lbme{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;margin:14px 0 12px;background:#fff;border:2px solid var(--g700);box-shadow:0 10px 24px rgba(10,90,57,.14)}
.rkb{min-width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#C4EC5B,var(--lime));color:var(--g900);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:17px;flex-shrink:0}
.lbr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:20px;margin-bottom:8px}
.lbr.me{border:2px solid var(--g700);background:#F2FAEE}
.rkn{width:28px;height:28px;border-radius:50%;background:#EEF3EC;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink2);flex-shrink:0}
.lbp{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px;color:#8F6200;background:#FFF5D6;padding:5px 10px;border-radius:999px;flex-shrink:0}
.avc{display:inline-block;border-radius:50%;overflow:hidden;flex-shrink:0;line-height:0;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.avc svg{width:100%;height:100%;display:block}
.avpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avpick button{position:relative;aspect-ratio:1;border-radius:50%;padding:3px;border:3px solid transparent;transition:transform .15s}
.avpick button svg{width:100%;height:100%;display:block;border-radius:50%}
.avpick button.on{border-color:var(--g700);transform:scale(1.04)}
.avpick .tick{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--g700);color:#fff;display:none;place-items:center;border:2px solid #fff}
.avpick button.on .tick{display:grid}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(140deg,#fff,#CDEBB9);display:grid;place-items:center;font-family:var(--fd);font-weight:600;font-size:18px;color:var(--g900);border:2px solid #fff;flex-shrink:0}

.map{position:relative;height:290px;margin:0 -18px}
.eta{position:absolute;right:22px;top:58px;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.eta small{display:block;font-size:11px;color:var(--muted)}.eta b{font-family:var(--fd);font-size:17px}
.sheetcard{border-radius:32px;padding:12px 14px 16px;margin:-30px -6px 0;position:relative}
.grab{width:40px;height:5px;border-radius:5px;background:#C9D3CD;margin:0 auto 12px}

@media (max-width:760px){
  body{padding:0;display:block;background:#e9f8ef}
  .panel{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}
  .device{border-radius:0}
  .island,.homebar{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- standard mobile UI + readability pass ---------- */
.tiny{font-size:12.5px}.small{font-size:14px}.tag{font-size:12px}.nav button{font-size:12px}
.topbar .title,.topbar .title.glass{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 2px;height:46px;font-size:21px;font-weight:600}
.btn.sm{min-height:44px}
.btn:disabled{opacity:.5;pointer-events:none}
.lang-pill{height:46px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--g900);flex-shrink:0}
.brandmark{font-size:18px}
/* status messages at the bottom, like a phone snackbar */
#toast{top:58px;bottom:auto;left:16px;right:16px;width:auto;max-width:none;transform:translateY(-16px);border-radius:16px;padding:14px 16px;font-size:14px;box-shadow:0 10px 24px rgba(10,60,35,.25)}
#toast.show{transform:translateY(0)}
.tc-row{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:#fff;border:1px solid var(--line);margin-top:14px;font-size:14px;line-height:1.5;cursor:pointer}
.tc-row input{width:22px;height:22px;accent-color:var(--g800);flex-shrink:0;margin-top:1px;cursor:pointer}
.link-t{color:var(--g800);font-weight:700;text-decoration:underline;text-underline-offset:2px;padding:0;font-size:inherit;display:inline}
.tc-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.tc-item:last-child{border-bottom:0}
.tc-n{width:30px;height:30px;border-radius:50%;background:var(--g-soft);color:var(--g800);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;font-family:var(--fd)}
.tc-item b{display:block;font-family:var(--fd);font-size:16px;font-weight:600;margin-bottom:3px}
.tc-item p{font-size:14px;line-height:1.55;color:var(--ink2)}
.calblk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:20px;border:1px dashed var(--muted);background:repeating-linear-gradient(135deg,#F6F8F5 0 8px,#EEF2EC 8px 16px);color:var(--ink2)}
.calblk b{display:block;color:var(--ink);font-size:15px}.calblk small{font-size:12.5px}

/* ---------- v3 additions ---------- */

@keyframes okfade{from{opacity:0}to{opacity:1}}

const D=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)};
const ISO=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const addD=(iso,n)=>{const d=D(iso);d.setDate(d.getDate()+n);return ISO(d)};
const diffD=(a,b)=>Math.round((D(a)-D(b))/864e5);
const weekStart=iso=>addD(iso,-D(iso).getDay());
function dayLabel(iso){const n=diffD(iso,TODAY);if(n===0)return t('today');if(n===1)return t('tomorrow');if(n===-1)return t('yesterday');const d=D(iso);return `${t('d'+d.getDay())}, ${d.getDate()} ${MONS[S.lang][d.getMonth()]}`}
function fh(h){const hh=Math.floor(h),m=String(Math.round((h-hh)*60)).padStart(2,'0');
 if(S.lang==='hi'){const p=hh<12?'सुबह':hh<16?'दोपहर':hh<19?'शाम':'रात';return `${p} ${((hh+11)%12)+1}:${m}`}
 return `${((hh+11)%12)+1}:${m} ${hh<12?'AM':'PM'}`}

const AVS=[['#FFD9B8','#C68A5B','#2B1B12',1,'#0E7C6E'],['#CDEBFF','#A86B45','#1A1A1A',0,'#2752B5'],['#E5D9FF','#E0A878','#3A2416',2,'#B43A5E'],['#D6F5D0','#8D5A3B','#E8A33D',3,'#1B7A3F'],
 ['#FFE3EC','#B97A50','#2B1B12',4,'#5B3DC2'],['#FFF1C2','#D49A6A','#4A2C1A',0,'#B4561B'],['#D9F2EE','#9C6340','#222',1,'#8A5D00'],['#FBE0D0','#7A4A2E','#C2410C',3,'#3E4C5E']];
function avatar(i,s=48){const [bg,sk,hr,st,sh]=AVS[Math.max(0,i||0)%AVS.length];
 const fringe=`<path d="M17 28c-1-11 6-17 15-17s16 6 15 17c-2-5-7-8-15-8s-13 3-15 8z" fill="${hr}"/>`;
 const back=st===1?`<path d="M15 50c-4-14-3-30 6-36 6-4 16-4 22 0 9 6 10 22 6 36z" fill="${hr}"/>`:st===2?`<circle cx="32" cy="11" r="7" fill="${hr}"/>`:'';
 const front=st===3?`<path d="M16 27c0-11 7-18 16-18s16 7 16 18c-5-3-10-5-16-5s-11 2-16 5z" fill="${hr}"/><path d="M19 17q13 7 26-1" stroke="rgba(0,0,0,.18)" stroke-width="2" fill="none"/>`
  :st===4?[[18,22],[22,15],[29,11],[36,11],[42,15],[46,22]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.5" fill="${hr}"/>`).join(''):fringe;
 return `<svg viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="${bg}"/>${back}<path d="M9 64c2-11 11-17 23-17s21 6 23 17z" fill="${sh}"/><rect x="27" y="37" width="10" height="11" rx="4" fill="${sk}"/><ellipse cx="32" cy="29" rx="13" ry="14.5" fill="${sk}"/>${front}<circle cx="26.5" cy="30" r="1.8" fill="#2A1A12"/><circle cx="37.5" cy="30" r="1.8" fill="#2A1A12"/><circle cx="23" cy="35" r="2.4" fill="#FF7A6A" opacity=".3"/><circle cx="41" cy="35" r="2.4" fill="#FF7A6A" opacity=".3"/><path d="M27.5 36q4.5 4 9 0" stroke="#2A1A12" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`}
const avc=(i,s=44,ph)=>i==='photo'&&ph?`<span class="avc" style="width:${s}px;height:${s}px"><img src="${ph}" alt="" class="avimg"></span>`:`<span class="avc" style="width:${s}px;height:${s}px">${avatar(i==='photo'?0:i,s)}</span>`;
const myAv=(s=44)=>S.av==='photo'&&S.photo?avc('photo',s,S.photo):S.av>=0?avc(S.av,s):`<span class="avatar" style="width:${s}px;height:${s}px">${initials()||ic('user',Math.round(s/2.4))}</span>`;
function avPicker(p,then='rerender()'){const o=S[p];return `<div class="avpick">${AVS.slice(0,7).map((_,i)=>`<button class="${o.av===i?'on':''}" aria-pressed="${o.av===i}" aria-label="Avatar ${i+1}" onclick="S['${p}'].av=${i};${then}">${avatar(i,60)}<span class="tick">${ic('check',12)}</span></button>`).join('')}
 <label class="avup ${o.av==='photo'?'on':''}" aria-label="${t('uploadPic')}" title="${t('uploadPic')}">${o.photo?`<img src="${o.photo}" alt="">`:ic('plus',28)}<input type="file" accept="image/*" onchange="avUpload(event,'${p}')"><span class="tick">${ic('check',12)}</span></label></div>
 <div class="tiny muted mt8 row" style="gap:5px">${ic('camera',14)}${t('upHint')}</div>`}
function avUpload(e,p){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S[p].photo=r.result;S[p].av='photo';if(p==='ed'&&$('#overlay').classList.contains('show'))closeOv();rerender();toast(t('uploadPic'),'camera')};r.readAsDataURL(f)}
function toast(m,i='check'){const el=$('#toast');el.innerHTML=ic(i,16)+esc(m);el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2800)}
function tierIdx(p){let i=0;TIERS.forEach((x,k)=>{if(p>=x[1])i=k});return i}
function medal(i,s=44,locked=false){const [k,,a,b]=TIERS[i];return `<div class="medal ${locked?'locked':''}" style="width:${s}px;height:${s}px"><svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true"><defs><linearGradient id="g${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="M24 2l19 10.5v23L24 46 5 35.5v-23z" fill="url(#g${k})"/><circle cx="24" cy="24" r="12.5" fill="#fff" opacity=".92"/><path d="M24 15.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L24 28.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="${b}"/></svg>${locked?`<span class="lock">${ic('lock',11)}</span>`:''}</div>`}
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const initials=()=>S.name?ini(S.name):'';
function topbar(title,{back=true,right=''}={}){return `<div class="topbar">${back?`<button class="circle glass" onclick="back()" aria-label="${t('back')}">${ic('left',20)}</button>`:''}${title?`<div class="title glass">${title}</div>`:''}<span class="sp"></span>${right}</div>`}
function otpBoxes(){return `<div class="otp otp6" id="otp" onclick="kpShow()">${[0,1,2,3,4,5].map(i=>`<input inputmode="none" onclick="kpShow()" maxlength="${i?1:6}" ${i?'':'autocomplete="one-time-code"'} aria-label="Digit ${i+1}">`).join('')}</div>`}
function wireOtp(){const ins=[...document.querySelectorAll('#otp input')];ins.forEach((inp,i)=>{inp.addEventListener('input',()=>{const v=inp.value.replace(/\D/g,'');if(v.length>1){v.slice(0,6-i).split('').forEach((c,k)=>ins[i+k].value=c);(ins[Math.min(5,i+v.length)]||inp).focus()}else{inp.value=v;if(v&&ins[i+1])ins[i+1].focus()}if(ins.every(x=>x.value))setTimeout(()=>{if(cur().n==='otp')verifyOtp()},250)});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus()})});setTimeout(()=>{if(cur().n!=='otp'||!ins[0])return;ins[0].focus();kpShow()},300);startResend()}
let rsT=null;function startResend(){let n=30;clearInterval(rsT);rsT=setInterval(()=>{n--;const b=document.getElementById('rsBtn');if(!b){clearInterval(rsT);return}if(n<=0){clearInterval(rsT);b.disabled=false;b.textContent=t('resendOtp')}else b.textContent=t('resendOtpIn',{n:'00:'+String(n).padStart(2,'0')})},1000)}

const DEL_IC=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H8l-6 7 6 7h13a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="m16 9-5 6M11 9l5 6"/></svg>`;
const kbFields=()=>[...document.querySelectorAll('#screen [data-kb]')];
function kpShow(el){
 if(el&&el.dataset&&el.dataset.kb){KB.el=el;KB.mode=el.dataset.kb;KB.sym=false;KB.caps=KB.mode==='text'&&kbAutoCaps(el.value)}
 else if(kpOtp()){KB.el=null;KB.mode='otp'}else{KB.el=$('#ph');KB.mode='ph'}
 KB.at=performance.now();kpDraw();$('#kp').classList.add('show');$('#device').classList.add('kp-open');requestAnimationFrame(kpLift)}
const kbAutoCaps=v=>!v||/[.!?।]\s$/.test(v);
function kpDraw(){const k=$('#kp'),m=KB.mode;
 const lb=KB.el&&KB.el.closest('.field,.grow')?.querySelector('label,.tlabel');
 const title=m==='otp'?t('kpOtp'):m==='ph'?t('kpTitle'):(lb?lb.textContent.trim():'');

 let body;
 if(m==='text'){const rows=KB.sym?['1234567890','-/:;()₹&@"',".,?!'"]:['qwertyuiop','asdfghjkl','zxcvbnm'];
  const key=c=>{const v=KB.caps&&!KB.sym?c.toUpperCase():c;return B(esc(v),`data-k="${encodeURIComponent(v)}"`)};
  const last=kbFields().indexOf(KB.el)===kbFields().length-1;

  <div class="kb-row">${KB.sym?'':B('⇧','data-a="shift"','kb-fn'+(KB.caps?' on':''),'Shift')}${[...rows[2]].map(key).join('')}${B(DEL_IC,'data-a="del"','kb-fn','Delete')}</div>
  <div class="kb-row">${B(KB.sym?'ABC':'123','data-a="sym"','kb-fn')}${B(t('kbSpace'),'data-k="%20"','kb-space')}${B(last?t('kpDone'):t('kbNext'),'data-a="go"','kb-go')}</div>`}
 else{const goAria=m==='otp'?t('verifyBtn'):m==='ph'?t('continue'):t('kbNext');
  body=`<div class="kp-grid">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']].map(([d,l])=>B(`${d}<small>${l}</small>`,`data-k="${d}"`)).join('')}${B(ic('arrow',22),'data-a="go"','kp-go',goAria)}${B('0<small>+</small>','data-k="0"')}${B(DEL_IC,'data-a="del"','kp-fn','Delete')}</div>`}
 k.innerHTML=`<div class="kp-top"><span>${esc(title)}</span><button data-a="done">${t('kpDone')}</button></div>${body}`}
/* keys: keep focus in the field (mousedown) and act on click */
function kpWire(){const k=$('#kp');if(!k||k._w)return;k._w=1;
 k.addEventListener('mousedown',e=>e.preventDefault());
 k.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(b.dataset.k!==undefined)kpKey(decodeURIComponent(b.dataset.k));
  else if(a==='del')kpKey('del');else if(a==='go')kpGo();else if(a==='done')kpHide();
  else if(a==='shift'){KB.caps=!KB.caps;kpDraw()}else if(a==='sym'){KB.sym=!KB.sym;kpDraw()}})}
/* lift: centred login/OTP pages slide up; scrolling pages scroll the field above the keyboard */
function kpLift(){const k=$('#kp'),v=$('.view');if(!v||!k.classList.contains('show'))return;const kTop=$('#device').getBoundingClientRect().bottom-k.offsetHeight;
 if($('.auth2.center')){const b=$(KB.mode==='otp'?'#otp':'.phonebox');if(!b)return;
  /* also keep the Continue / Verify button in view, as long as the logo still fits on screen */
  const c=$('.auth2.center .btn.dark'),top=$('.view .brand'),room=top?top.getBoundingClientRect().top-$('#screen').getBoundingClientRect().top-6:0;
  let lift=b.getBoundingClientRect().bottom+12-kTop;if(c)lift=Math.max(lift,Math.min(c.getBoundingClientRect().bottom+14-kTop,room));
  if(lift>0)v.style.transform=`translateY(${-lift}px)`;return}
 const sc=$('#screen'),el=KB.el;sc.style.paddingBottom=(k.offsetHeight+16)+'px';if(!el)return;
 const r=el.getBoundingClientRect(),top=sc.getBoundingClientRect().top;let d=r.bottom+16-kTop;if(r.top-d<top+8)d=r.top-top-8;
 if(d)sc.scrollBy({top:d,behavior:'smooth'})}
function kpHide(){const k=$('#kp');if(!k)return;k.classList.remove('show');$('#device').classList.remove('kp-open');const v=$('.view');if(v)v.style.transform='';const sc=$('#screen');if(sc)sc.style.paddingBottom='';const a=document.activeElement;if(a&&a.closest&&a.closest('.phonebox,#otp,[data-kb]'))a.blur();KB.el=null}
function kpGo(){const m=KB.mode;if(m==='otp'){verifyOtp();return}if(m==='ph'){kpHide();sendCode();return}
 const f=kbFields(),n=f[f.indexOf(KB.el)+1];if(n){n.focus();kpShow(n)}else kpHide()}
function kpKey(d){const m=KB.mode;if(m==='otp')return kpOtpKey(d);const i=KB.el;if(!i)return;
 if(d==='del')i.value=i.value.slice(0,-1);
 else{const mx=+i.getAttribute('maxlength')||1e4;if(i.value.length>=mx)return;i.value+=d}
 i.dispatchEvent(new Event('input',{bubbles:true}));i.scrollTop=i.scrollHeight;
 if(m==='ph')$('#phErr').classList.remove('show');
 if(m==='text'){const c=!KB.sym&&kbAutoCaps(i.value);if(c!==KB.caps){KB.caps=c;kpDraw()}}}
/* OTP: a digit fills the next empty box (the box's own input handler moves focus and auto-checks); delete clears the last one */
function kpOtpKey(d){const ins=[...document.querySelectorAll('#otp input')];if(!ins.length)return;$('#otpErr').classList.remove('show');
 if(d==='del'){const f=ins.filter(x=>x.value).pop();if(f){f.value='';f.focus()}return}
 const e=ins.find(x=>!x.value);if(!e)return;e.focus();e.value=d;e.dispatchEvent(new Event('input'))}
/* any field marked data-kb opens the matching keyboard when touched */
let kbPress=0;document.addEventListener('pointerdown',()=>{kbPress=performance.now()},true);
document.addEventListener('focusin',e=>{const el=e.target;if(performance.now()-kbPress<800)return;if(el.matches&&el.matches('[data-kb]')&&!(KB.el===el&&$('#kp').classList.contains('show')))kpShow(el)});
document.addEventListener('click',e=>{const el=e.target;if(el.matches&&el.matches('[data-kb]')&&!(KB.el===el&&$('#kp').classList.contains('show')))kpShow(el)});
/* tapping anything else closes the keyboard AFTER that tap has done its job, so one tap is enough */
/* composedPath is fixed when the tap starts, so a key that redraws the keyboard still counts as inside it */
document.addEventListener('click',e=>{if(!$('#kp')?.classList.contains('show')||performance.now()-(KB.at||0)<350)return;if(e.composedPath().some(n=>n.nodeType===1&&n.matches&&n.matches('#kp,.phonebox,#otp,[data-kb]')))return;kpHide()});

/* ================= Requests =================
   Today's work: pops up full screen (no countdown) and stays until the worker answers or taps "Later".
   Later days: no pop-up — the request waits in "New work requests" on Home.
   Only requests matching the worker's skills and travel distance are sent / shown. */
function sheet(html,cls='',req=''){const o=$('#overlay');o.innerHTML=`<div class="scrim" onclick="closeOv()"></div><div class="sheet ${cls}" role="dialog" ${req?`data-req="${req}"`:''}>${html}</div>`;o.classList.add('show')}
/* every request has an end time: today's work 3 min, later days 1 hour — then it is cancelled */
const EXP_TODAY=3*60e3,EXP_LATER=60*60e3;
function expTxt(r){const ms=Math.max(0,(r.exp||0)-Date.now());if(r.date===TODAY){const x=Math.ceil(ms/1000);return `${Math.floor(x/60)}:${String(x%60).padStart(2,'0')}`}return t('minN',{n:Math.ceil(ms/60e3)})}
setInterval(()=>{if(!S.sreqs)return;document.querySelectorAll('[data-exp]').forEach(e=>{const r=getReq(e.dataset.exp);if(r)e.textContent=expTxt(r)});
 const gone=S.sreqs.filter(r=>r.exp&&r.exp<=Date.now());if(!gone.length)return;
 S.sreqs=S.sreqs.filter(r=>!gone.includes(r));if(gone.some(r=>r.id===S.pop))hideFull();
 const sh=$('.sheet[data-req]');if(sh&&gone.some(r=>r.id===sh.dataset.req))closeOv();
 if(cur()&&cur().n==='home')rerender();toast(t('reqExpired'),'clock')},1000);
function closeOv(){const o=$('#overlay');o.classList.remove('show');o.innerHTML=''}
const canGet=()=>S.loggedIn&&S.registered&&S.available&&!blockedNow();
const getReq=id=>S.sreqs.find(r=>r.id===id);
function sendToday(){if(!canGet()){toast(!S.registered?t('needReg'):t('jobAlertsOff'),'moon');return}
 const pool=TODAYREQ.filter(matches);if(!pool.length){toast(t('noReqs'),'info');return}
 const m=pool[S.urgIdx++%pool.length];S.sreqs=S.sreqs.filter(r=>r.src!==m);
 const r={...m,src:m,date:TODAY,id:'s'+(uid++),exp:Date.now()+EXP_TODAY};S.sreqs.unshift(r);S.pop=r.id;
 closeOv();if(!SCREENS[cur().n].nav)tab('home');else rerender();showFull()}
function sendSched(){if(!canGet()){toast(!S.registered?t('needReg'):t('jobAlertsOff'),'moon');return}
 const pool=SCHED.filter(matches);if(!pool.length){toast(t('noReqs'),'info');return}
 const left=pool.filter(m=>!S.sreqs.some(r=>r.src===m));const m=left.length?left[0]:pool[S.schedIdx++%pool.length];
 S.sreqs.push({...m,src:m,id:'s'+(uid++),exp:Date.now()+EXP_LATER});if(cur().n==='home')rerender();toast(t('newReq'),'bell')}
function showFull(){const j=getReq(S.pop);if(!j){$('#full').innerHTML='';return}
 $('#full').innerHTML=`<div class="fullreq" role="alertdialog" aria-label="${t('newReq')}">
  <div style="text-align:center"><span class="tag todayt">${t('todayReqTag')}</span><h2 style="font-size:32px;font-weight:600;margin-top:12px">${t('newReq')}</h2><p style="opacity:.85" class="small mt6">${t('matchedSub')}</p></div>
  <div class="pulse"><span></span><span></span><span></span><div class="core">${catPic(j.cat,62)}</div></div>
  <div style="text-align:center"><div class="fd" style="font-size:24px;font-weight:500">${cn(j.cat)}</div><div class="fd" style="font-size:30px;font-weight:700;line-height:1.2;color:#C4EC5B">${t('today')}</div>
  <div class="fr-loc mt12">${ic('pin',16)}<span><b>${esc(L(j.place))}</b><small>${t('away',{d:j.dist})}</small></span></div>
  <div class="popexp mt12">${ic('clock',15)} ${t('expIn',{t:`<b data-exp="${j.id}">${expTxt(j)}</b>`})}</div></div>
  <div style="margin-top:auto"><button class="btn lime" style="min-height:58px;font-size:17px" onclick="acceptReq('${j.id}')">${ic('check',22)} ${t('accept')}</button>
  <div class="btns mt8"><button class="btn ghostw" onclick="hideFull();reqSheet('${j.id}')">${t('viewFull')}</button><button class="btn ghostw" onclick="hideFull()">${t('later')}</button></div></div></div>`}

 sheet(`<div class="grab"></div><div class="spark bigic" style="color:#9A6A06;background:radial-gradient(circle at 35% 30%,#fff,#FCEFCF 60%,#F5D38A)">${ic('alert',32)}</div>
 <h3 style="text-align:center;font-size:21px;font-weight:500">${t('clashTitle')}</h3>
 <p class="small muted mt8" style="text-align:center;line-height:1.5">${t(near.length===1?'clashBody1':'clashBody',{n:near.length})}</p>
 <div class="mt12">${all.map(({x,isNew})=>`<div class="irow" style="${isNew?'border:1.5px dashed var(--g500);background:#fff':''}">${art(x.cat,40,18)}<div class="grow"><b>${cn(x.cat)}</b>${isNew?` <span class="tag green" style="padding:2px 8px">${t('newTag')}</span>`:''}<small>${isNew?dayLabel(x.date):x.status==='inprogress'?`${t('workingNow')} · ${t('startedAt',{t:fh(x.s)})}`:t('startsAt',{t:fh(x.s)})}</small></div></div>`).join('')}</div>
 <p class="b mt16" style="text-align:center">${t('clashQ')}</p>
 <button class="btn dark mt12" onclick="acceptReq('${id}',true)">${ic('check',18)} ${t('yesAccept')}</button><button class="btn soft mt8" onclick="closeOv()">${t('noBack')}</button>`,'',id)}
function acceptReq(id,sure){const j=getReq(id);if(!j)return;
 if(!sure&&nearJobs(j).length){hideFull();clashSheet(id);return}
 closeOv();hideFull();S.sreqs=S.sreqs.filter(r=>r.id!==id);
 const {src,...job}=j;S.jobs.push({...job,id:'t'+(uid++),status:'upcoming',stage:1});
 if(j.date===TODAY)S.points+=3;rerender();toast(j.date===TODAY?t('acceptedAsap'):t('addedCal',{d:dayLabel(j.date)}),'calendar')}
function declineReq(id){if(S.pop===id)hideFull();S.sreqs=S.sreqs.filter(r=>r.id!==id);closeOv();rerender();toast(t('declined'),'x')}

/* ================= Side panel ================= */
function panel(){
 $('#demo').innerHTML=`<button class="dbtn" onclick="sendToday()">${ic('zap',16)} Send TODAY's work (pop-up)</button>
 <button class="dbtn" onclick="sendSched()">${ic('calendar',16)} Send later-day request</button>
 <button class="dbtn" onclick="sitMeCancel()">${ic('hammer',16)} Worker cancels a job (customer told with reason)</button>
 <button class="dbtn" onclick="sitCustCancel()">${ic('bell',16)} Customer cancelled: notification to me with reason</button>
 <button class="dbtn" onclick="demo(false)">${ic('user',16)} New user (not registered)</button>
 <button class="dbtn" onclick="demo(true)">${ic('shieldok',16)} Registered worker (with data)</button>
 <button class="dbtn" onclick="setLang(S.lang==='en'?'hi':'en')">${ic('globe',16)} ${S.lang==='en'?'Switch to हिन्दी':'Switch to English'}</button>
 <button class="dbtn" onclick="fresh(false);replaceTo('splash')">${ic('leaf',16)} Restart from logo</button>`;
 $('#jump').innerHTML=[['splash','Logo'],['login','Login'],['otp','OTP'],['home','Home'],['reg','Registration'],['cal','Calendar'],['lb','Achievements'],['profile','Profile'],['edit','Profile update'],['alerts','Alerts'],['support','Support'],['badges','Badges'],['job','Job details'],['terms','Terms']].map(([k,l])=>`<button onclick="jump('${k}')">${l}</button>`).join('')}
function demo(reg){hideFull();fresh(reg);S.loggedIn=true;S.phone='9876543210';S.regShown=reg;tab('home');if(reg)setTimeout(sendToday,1600)}
function jump(k){closeOv();
 if(['splash','login','otp'].includes(k)){stack=[{n:k==='splash'?'splash':'login'}];if(k==='otp')go('otp');else render();return}
 if(!S.loggedIn){S.loggedIn=true;S.phone='9876543210';S.regShown=true}
 if(['edit','job','cal','lb'].includes(k)&&!S.registered){hideFull();fresh(true);S.loggedIn=true;S.phone='9876543210';S.regShown=true}
 if(k==='reg'){stack=[{n:'home'}];startReg();return}
 if(k==='edit'){stack=[{n:'profile'}];openEdit();return}
 if(k==='job'){stack=[{n:'home'}];go('job','t1');return}
 if(SCREENS[k].nav)tab(k);else{stack=[{n:'home'}];go(k)}}

$('#sb').innerHTML=ic('signal',16)+ic('wifi',16)+ic('battery',24);
kpWire();$('#panelLogo').innerHTML=brand();stack=[{n:'splash'}];render();
</script>
</body>
</html>
